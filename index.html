    // --- GLOBAL STATE ---
    const state = {
      user: null,
      authReady: false,
      view: 'home', // home, host, player, editor
      gamePin: '',
      gameDoc: null,
      quizData: [],
      errorMsg: '',
      playerName: '',
      showAdminModal: false,
      adminPass: '',
      adminError: '',
      saveMessage: '',
      adminPendingAction: null,
      exportText: '' // Προσθήκη state για την Εξαγωγή
    };

    let unsubscribeGame = null;
    let hostTimerInterval = null;
    let playerTimerInterval = null;

    // --- HELPERS ---
    const escapeHtml = (str) => String(str||'').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");

    // --- INITIALIZATION ---
    async function init() {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (err) {
        console.error("Auth error:", err);
        state.errorMsg = "Σφάλμα σύνδεσης.";
        renderFull();
      }

      onAuthStateChanged(auth, async (user) => {
        state.user = user;
        if (user) {
          state.authReady = true;
          try {
            const templateRef = doc(db, 'artifacts', appId, 'public', 'data', 'config', 'quiz_template');
            const snap = await getDoc(templateRef);
            if (snap.exists() && snap.data().items && snap.data().items.length > 0) {
              state.quizData = snap.data().items;
            } else {
              state.quizData = JSON.parse(JSON.stringify(DEFAULT_QUIZ_DATA));
            }
          } catch (e) {
            state.quizData = JSON.parse(JSON.stringify(DEFAULT_QUIZ_DATA));
          }

          // ΕΛΕΓΧΟΣ ΓΙΑ REFRESH (AUTO-RECONNECT)
          const savedSession = sessionStorage.getItem('lifepulse_quiz');
          if (savedSession) {
            try {
              const parsed = JSON.parse(savedSession);
              state.gamePin = parsed.pin;
              state.view = parsed.view;
              listenToGame(); // Αυτό θα τραβήξει τα δεδομένα και θα κάνει renderFull()
              return; // Σταματάμε εδώ για να μην φορτώσει την αρχική οθόνη
            } catch (e) {
              sessionStorage.removeItem('lifepulse_quiz');
            }
          }

          renderFull();
        }
      });
    }

    // --- FIREBASE GAME LISTENER ---
    function listenToGame() {
      if (unsubscribeGame) unsubscribeGame();
      if (!state.gamePin || state.view === 'home' || state.view === 'editor') return;

      const gameRef = doc(db, 'artifacts', appId, 'public', 'data', 'games', state.gamePin);
      unsubscribeGame = onSnapshot(gameRef, (docSnap) => {
        if (docSnap.exists()) {
          const newData = docSnap.data();
          const needsFullRender = !state.gameDoc || state.gameDoc.status !== newData.status || state.gameDoc.currentStepIndex !== newData.currentStepIndex;
          state.gameDoc = newData;
          
          if (needsFullRender) renderFull();
          else updateGranular();
        } else {
          state.errorMsg = "Το παιχνίδι δεν βρέθηκε ή τερματίστηκε.";
          state.view = 'home';
          state.gameDoc = null;
          
          // ΚΑΘΑΡΙΣΜΟΣ ΣΥΝΕΔΡΙΑΣ
          sessionStorage.removeItem('lifepulse_quiz');
          
          renderFull();
        }
      }, (err) => console.error("Firestore error:", err));
    }

    // --- ACTION HANDLERS (EXPOSED TO WINDOW) ---
    window.actions = {
      setGamePin: (e) => { state.gamePin = e.target.value; },
      setPlayerName: (e) => { state.playerName = e.target.value; },
      setAdminPass: (e) => { state.adminPass = e.target.value; },
      
      joinGame: async (e) => {
        e.preventDefault();
        state.errorMsg = '';
        if (!state.gamePin || !state.playerName) {
          state.errorMsg = "Συμπληρώστε PIN και Όνομα.";
          renderFull(); return;
        }
        try {
          const gameRef = doc(db, 'artifacts', appId, 'public', 'data', 'games', state.gamePin);
          const snap = await getDoc(gameRef);
          if (!snap.exists()) {
            state.errorMsg = "Δεν βρέθηκε παιχνίδι με αυτό το PIN.";
            renderFull(); return;
          }
          
          const gameData = snap.data();
          gameData.players = gameData.players || {};
          gameData.players[state.user.uid] = { name: state.playerName, score: 0, currentAnswer: -1, answerTime: 0 };
          
          await updateDoc(gameRef, { [`players.${state.user.uid}`]: gameData.players[state.user.uid] });
          
          state.gameDoc = gameData;
          state.view = 'player';
          
          // ΑΠΟΘΗΚΕΥΣΗ ΣΥΝΕΔΡΙΑΣ
          sessionStorage.setItem('lifepulse_quiz', JSON.stringify({ pin: state.gamePin, view: 'player' }));
          
          listenToGame();
          renderFull();
        } catch (err) {
          state.errorMsg = "Σφάλμα σύνδεσης στο παιχνίδι.";
          renderFull();
        }
      },

      executeCreateGame: async () => {
        state.errorMsg = '';
        const pin = Math.floor(1000 + Math.random() * 9000).toString();
        const newGame = {
          pin, hostUid: state.user.uid, status: 'lobby', currentStepIndex: -1,
          questionEndTime: 0, questionStartTime: 0, players: {} 
        };
        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'games', pin), newGame);
          state.gamePin = pin;
          state.gameDoc = newGame;
          state.view = 'host';
          
          // ΑΠΟΘΗΚΕΥΣΗ ΣΥΝΕΔΡΙΑΣ
          sessionStorage.setItem('lifepulse_quiz', JSON.stringify({ pin: state.gamePin, view: 'host' }));
          
          listenToGame();
          renderFull();
        } catch (err) {
          state.errorMsg = "Αποτυχία δημιουργίας παιχνιδιού.";
          renderFull();
        }
      },

      hostNextStep: async () => {
        if (!state.gameDoc) return;
        const nextIndex = state.gameDoc.currentStepIndex + 1;
        const gameRef = doc(db, 'artifacts', appId, 'public', 'data', 'games', state.gamePin);
        if (nextIndex >= state.quizData.length) {
          await updateDoc(gameRef, { status: 'end' });
          return;
        }
        const nextStepData = state.quizData[nextIndex];
        const updates = { currentStepIndex: nextIndex, status: 'active' };

        if (nextStepData.type === 'question') {
          // 1. Βάζουμε το status σε "show_question" αντί για "active"
          updates.status = 'show_question'; 
          Object.keys(state.gameDoc.players || {}).forEach(uid => {
            updates[`players.${uid}.currentAnswer`] = -1;
            updates[`players.${uid}.answerTime`] = 0;
          });
          
          await updateDoc(gameRef, updates);
          
          // 2. Ο Host τρέχει ένα κρυφό ρολόι 5 δευτερολέπτων 
          clearTimeout(window.questionDelayTimer);
          window.questionDelayTimer = setTimeout(async () => {
             // Όταν περάσουν τα 5 δευτερόλεπτα, εμφανίζουμε τις απαντήσεις!
             const currentSnap = await getDoc(gameRef);
             if (currentSnap.exists() && currentSnap.data().status === 'show_question') {
                 await updateDoc(gameRef, {
                    status: 'active',
                    questionStartTime: Date.now(),
                    questionEndTime: Date.now() + ((nextStepData.time || 20) * 1000)
                 });
             }
          }, 5000); // 5000 ms = 5 δευτερόλεπτα
          return;
        }
        
        await updateDoc(gameRef, updates);
      },

      hostShowAnswer: async () => {
        if (!state.gameDoc) return;
        const currentStep = state.quizData[state.gameDoc.currentStepIndex];
        if (currentStep.type !== 'question') return;
        
        const updates = { status: 'answer' };
        Object.entries(state.gameDoc.players || {}).forEach(([uid, pData]) => {
          if (pData.currentAnswer === currentStep.correct) {
            const timeTaken = pData.answerTime - state.gameDoc.questionStartTime;
            const totalTime = state.gameDoc.questionEndTime - state.gameDoc.questionStartTime;
            const timeRatio = Math.max(0, 1 - (timeTaken / totalTime));
            const points = 500 + Math.round(500 * timeRatio);
            updates[`players.${uid}.score`] = pData.score + points;
          }
        });
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'games', state.gamePin), updates);
      },

      submitAnswer: async (idx) => {
        if (state.view !== 'player' || !state.gameDoc) return;
        
        // 1. Άμεση τοπική ενημέρωση για REAL-TIME απόκριση στην οθόνη του παίκτη!
        state.gameDoc.players[state.user.uid].currentAnswer = idx;
        renderFull(); // Κάνει refresh τα κουμπιά αστραπιαία

        // 2. Ενημέρωση της βάσης στο παρασκήνιο
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'games', state.gamePin), {
          [`players.${state.user.uid}.currentAnswer`]: idx,
          [`players.${state.user.uid}.answerTime`]: Date.now()
        });
      },

      openAdminModal: (actionType = 'editQuiz') => { 
        state.adminPendingAction = actionType;
        state.showAdminModal = true; 
        state.adminError = ''; 
        renderFull(); 
      },
      closeAdminModal: () => { 
        state.showAdminModal = false; 
        renderFull(); 
      },
      verifyAdmin: () => {
        if (state.adminPass === ADMIN_SECRET) {
          state.showAdminModal = false; 
          state.adminPass = ''; 
          state.adminError = '';
          
          if (state.adminPendingAction === 'createGame') {
            window.actions.executeCreateGame();
          } else {
            state.view = 'editor'; 
            renderFull();
          }
        } else {
          state.adminError = 'Λάθος κωδικός πρόσβασης!'; 
          renderFull();
        }
      },
      checkEnter: (e) => { if(e.key === 'Enter') window.actions.verifyAdmin(); },
      goToLobby: () => { state.view = 'host'; renderFull(); },
      
      saveQuiz: async () => {
        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'quiz_template'), { items: state.quizData });
          state.saveMessage = 'Αποθηκεύτηκε επιτυχώς!';
          renderFull();
          setTimeout(() => { state.saveMessage = ''; renderFull(); }, 3000);
        } catch (err) {
          state.saveMessage = 'Σφάλμα αποθήκευσης.'; renderFull();
        }
      },
      exportQuizData: () => {
        const dataStr = JSON.stringify(state.quizData, null, 2);
        state.exportText = `const DEFAULT_QUIZ_DATA = ${dataStr};`;
        renderFull();
      },
      closeExportModal: () => {
        state.exportText = '';
        renderFull();
      },
      copyExportText: () => {
        const ta = document.getElementById('export-textarea');
        ta.select();
        document.execCommand('copy');
        document.getElementById('copy-btn').innerText = 'Αντιγράφηκε!';
      },
      updateItemField: (idx, field, val) => { state.quizData[idx][field] = val; },
      updateItemOption: (qIdx, optIdx, val) => { state.quizData[qIdx].options[optIdx] = val; },
      updateItemCorrect: (qIdx, val) => { state.quizData[qIdx].correct = val; renderFull(); },
      moveItem: (idx, dir) => {
        if (idx + dir < 0 || idx + dir >= state.quizData.length) return;
        const temp = state.quizData[idx];
        state.quizData[idx] = state.quizData[idx + dir];
        state.quizData[idx + dir] = temp;
        renderFull();
      },
      deleteItem: (idx) => { state.quizData.splice(idx, 1); renderFull(); },
      insertItemAfter: (idx, type) => {
        const newItem = { type };
        if (type === 'question') {
          newItem.text = 'Νέα Ερώτηση'; newItem.options = ['Επιλογή 1', 'Επιλογή 2', 'Επιλογή 3', 'Επιλογή 4']; newItem.correct = 0; newItem.time = 20;
        } else if (type === 'phase_intro') {
          newItem.title = 'Νέα Φάση'; newItem.subtitle = 'Περιγραφή';
        } else if (type === 'media') {
          newItem.title = 'Διάλειμμα'; newItem.audioUrl = '';
        }
        state.quizData.splice(idx + 1, 0, newItem);
        renderFull();
      },
      resetGame: () => {
        sessionStorage.removeItem('lifepulse_quiz');
        state.view = 'home';
        state.gamePin = '';
        state.gameDoc = null;
        renderFull();
      },
      terminateGame: async () => {
        const confirmExit = confirm("Είστε σίγουροι ότι θέλετε να τερματίσετε το παιχνίδι; Όλοι οι παίκτες θα αποσυνδεθούν αμέσως και το δωμάτιο θα κλείσει.");
        if (!confirmExit) return;

        if (state.gamePin) {
          try {
            const gameRef = doc(db, 'artifacts', appId, 'public', 'data', 'games', state.gamePin);
            await deleteDoc(gameRef); // Διαγράφει το παιχνίδι από τη βάση, πετώντας έξω τους παίκτες
          } catch (err) {
            console.error("Σφάλμα κατά τον τερματισμό:", err);
          }
        }

        // Καθαρισμός μνήμης και επιστροφή στην αρχική
        sessionStorage.removeItem('lifepulse_quiz');
        state.view = 'home';
        state.gamePin = '';
        state.gameDoc = null;
        renderFull();
      }
    };


    // --- RENDER LOGIC ---

    function getLeaderboardHtml(players, isEnd, isHost) {
      const sorted = Object.values(players).sort((a, b) => b.score - a.score).slice(0, 3);
      let html = `<div class="w-full max-w-3xl text-center bg-white p-6 md:p-8 rounded-3xl shadow-xl mx-auto my-8 relative z-10">
        <i data-lucide="trophy" class="w-16 h-16 text-yellow-500 mx-auto mb-4 ${isEnd ? 'animate-bounce' : ''}"></i>
        <h2 class="text-3xl md:text-4xl font-extrabold text-gray-900 mb-8">${isEnd ? 'Τελική Βαθμολογία!' : 'Top 3'}</h2>
        <div class="space-y-3 md:space-y-4 mb-10">`;
      
      if (sorted.length === 0) html += `<div class="text-gray-500 italic">Κανένας παίκτης με βαθμούς...</div>`;
      
      sorted.forEach((p, idx) => {
        const bg = idx === 0 ? 'bg-yellow-500' : idx === 1 ? 'bg-gray-400' : idx === 2 ? 'bg-amber-700' : 'bg-[#cc8fb3]';
        const delay = (sorted.length - 1 - idx) * 0.8; 
        
        // TRIGGER CONFETTI ΓΙΑ ΤΟΝ ΝΙΚΗΤΗ (ΜΟΝΟ ΣΤΟΝ HOST)
        if (isEnd && idx === 0 && isHost) {
          setTimeout(() => {
            confetti({
              particleCount: 200,
              spread: 80,
              origin: { y: 0.6 },
              colors: ['#7f265b', '#10B981', '#F19821', '#2A48B2', '#ffd700']
            });
          }, delay * 1000);
        }

        html += `<div class="flex items-center justify-between bg-gray-50 p-3 md:p-4 rounded-xl border border-gray-100 animate-leaderboard shadow-sm" style="animation-delay: ${delay}s;">
          <div class="flex items-center gap-3 md:gap-4">
            <span class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-white ${bg} shadow-md">${idx + 1}</span>
            <span class="text-xl md:text-2xl font-bold text-gray-800">${escapeHtml(p.name)}</span>
          </div>
          <span class="text-xl md:text-2xl font-extrabold text-[#7f265b]">${p.score} pt</span>
        </div>`;
      });
      
      html += `</div>`;
      
      if (!isEnd && isHost) html += `<button onclick="actions.hostNextStep()" class="bg-[#7f265b] hover:bg-[#661e49] text-white px-8 py-4 rounded-xl font-bold text-xl shadow-lg transition">Επόμενο</button>`;
      
      if (isEnd) {
        html += `
          <div class="text-gray-500 mt-8 mb-6 font-medium animate-pulse-fast">Ελπίζουμε να περάσατε bloody awesome! 🩸</div>
          <button onclick="actions.resetGame()" class="bg-[#7f265b] hover:bg-[#661e49] text-white px-8 py-4 rounded-xl font-bold text-xl shadow-lg transition transform hover:scale-105 flex items-center gap-2 mx-auto">
            Παίξε ξανά 🔄
          </button>
        `;
      }
      
      html += `</div>`;
      return html;
    }

      const currentStep = state.gameDoc && state.gameDoc.currentStepIndex >= 0 ? state.quizData[state.gameDoc.currentStepIndex] : null;

        body.style.backgroundColor = '#330f25';

        body.style.backgroundColor = '#f9fafb';
      }

                ${state.saveMessage ? `<span class="text-green-300 font-bold text-sm bg-green-900/50 px-3 py-1 rounded-full">${state.saveMessage}</span>` : ''}
                <button onclick="actions.exportQuizData()" class="bg-[#4d1737] hover:bg-[#1a0813] text-white px-4 py-2 rounded-lg font-bold flex items-center gap-2 transition hidden sm:flex"><i data-lucide="code" class="w-4 h-4"></i> Εξαγωγή</button>
                <button onclick="actions.saveQuiz()" class="bg-[#f1dae7] hover:bg-white text-[#330f25] px-4 py-2 rounded-lg font-bold flex items-center gap-2 transition"><i data-lucide="save" class="w-4 h-4"></i> Αποθήκευση</button>
                <button onclick="actions.goToLobby()" class="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg font-bold transition">Πίσω</button>
              </div>

        `;
        state.quizData.forEach((item, index) => {
          html += `<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 relative group">

               <button onclick="actions.moveItem(${index}, 1)" ${index===state.quizData.length-1?'disabled':''} class="p-2 hover:bg-gray-100 rounded disabled:opacity-30"><i data-lucide="arrow-down" class="w-4 h-4"></i></button>
               <button onclick="actions.deleteItem(${index})" class="p-2 hover:bg-red-50 text-red-500 rounded"><i data-lucide="trash-2" class="w-4 h-4"></i></button>

               <span class="text-gray-400 font-bold text-sm">#${index + 1}</span>

              <div><label class="block text-xs font-bold text-gray-500 mb-1">YouTube Embed URL</label><input type="text" oninput="actions.updateItemField(${index}, 'url', this.value)" value="${escapeHtml(item.url)}" class="w-full border rounded-lg p-2"></div>

        html += `
        <div class="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4">
          <div class="bg-white rounded-2xl p-8 max-w-sm w-full shadow-2xl relative">
            <button onclick="actions.closeAdminModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-800"><i data-lucide="x"></i></button>
            <div class="mx-auto w-16 h-16 bg-[#f1dae7] rounded-full flex items-center justify-center mb-4"><i data-lucide="lock" class="text-[#7f265b] w-8 h-8"></i></div>
            <h2 class="text-2xl font-bold text-center text-[#330f25] mb-2">Ασφάλεια</h2>
            <p class="text-center text-gray-500 mb-6 text-sm">Πληκτρολόγησε τον κωδικό πρόσβασης.</p>
            ${state.adminError ? `<p class="text-red-500 text-sm mb-4 text-center font-bold">${state.adminError}</p>` : ''}
            <input type="password" oninput="actions.setAdminPass(event)" onkeydown="actions.checkEnter(event)" class="w-full border-2 border-gray-200 rounded-lg px-4 py-3 mb-6 focus:ring-2 focus:ring-[#7f265b] outline-none text-center text-xl tracking-widest" placeholder="Κωδικός">
            <button onclick="actions.verifyAdmin()" class="w-full bg-[#7f265b] hover:bg-[#661e49] text-white font-bold py-3 rounded-xl">Είσοδος</button>
          </div>
        </div>`;
      }

      // --- EXPORT MODAL ---
      if (state.exportText) {
        html += `
        <div class="fixed inset-0 bg-black/60 z-[200] flex items-center justify-center p-4">
          <div class="bg-white rounded-2xl p-8 max-w-3xl w-full shadow-2xl relative flex flex-col h-[80vh] md:h-[60vh]">
            <button onclick="actions.closeExportModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-800"><i data-lucide="x"></i></button>
            <h2 class="text-2xl font-bold text-center text-[#330f25] mb-2">Εξαγωγή Κώδικα</h2>
            <p class="text-gray-600 mb-4 text-sm text-center">Αντέγραψε το παρακάτω κείμενο και αντικατέστησε το μπλοκ <b>const DEFAULT_QUIZ_DATA</b> στον κώδικα (κοντά στη γραμμή 65).</p>
            <textarea id="export-textarea" class="w-full flex-grow p-4 border-2 border-gray-200 rounded-lg text-sm font-mono bg-gray-50 outline-none resize-none" readonly>${escapeHtml(state.exportText)}</textarea>
            <button id="copy-btn" onclick="actions.copyExportText()" class="mt-4 w-full bg-[#7f265b] hover:bg-[#661e49] text-white font-bold py-3 rounded-xl">Αντιγραφή στο Πρόχειρο</button>
          </div>
        </div>`;
      }

      app.innerHTML = html;
      lucide.createIcons();

      // Επανατοποθέτηση του persistent audio στο σωστό slot αν υπάρχει αρχείο ήχου
      if (audioContainer) {
          const slot = document.getElementById('audio-slot');

          if (state.view === 'host' && state.gameDoc && state.gameDoc.status !== 'lobby' && currentStep?.audioUrl) {
             if (slot) slot.appendChild(audioContainer);
             audioContainer.className = "w-full max-w-md mx-auto my-4 z-20 relative outline-none drop-shadow-lg";
             
             // Συγκρίνουμε το URL με αυτό που παίζει ήδη
             const newUrl = new URL(currentStep.audioUrl, window.location.href).href;
             if (audioContainer.src !== newUrl) {
                audioContainer.src = currentStep.audioUrl;
                audioContainer.play().catch(e => console.warn('Το Autoplay εμποδίστηκε από τον Browser', e));
             }
          } else {
             document.body.appendChild(audioContainer);
             audioContainer.className = "hidden";
             if (!currentStep?.audioUrl) {
               audioContainer.pause();
               audioContainer.removeAttribute('src'); // Σταματάμε τη μουσική αν πάμε σε ερώτηση χωρίς ήχο
             }
          }
      }
    }

    // --- TIMERS ---
    function startHostTimer(endTime, totalTime) {
      clearInterval(hostTimerInterval);
      const update = () => {
        const remaining = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
        const el = document.getElementById('host-timer-text');
        const bar = document.getElementById('host-timer-bar');
        const circle = document.getElementById('host-timer-circle');
        if(!el) return clearInterval(hostTimerInterval);
        el.innerText = remaining;
        bar.style.width = ((remaining / totalTime) * 100) + '%';
        let color = remaining <= 5 ? 'bg-red-500' : remaining <= 10 ? 'bg-yellow-500' : 'bg-green-500';
        circle.className = `w-20 h-20 md:w-24 md:h-24 rounded-full flex items-center justify-center text-3xl md:text-4xl font-extrabold text-white shadow-lg mb-4 transition-colors duration-500 ${color}`;
        bar.className = `h-3 rounded-full transition-all duration-500 linear ${color}`;
        if (remaining <= 0) { clearInterval(hostTimerInterval); if(state.view === 'host') window.actions.hostShowAnswer(); }
      };
      update(); hostTimerInterval = setInterval(update, 500);
    }

    function startPlayerTimer(endTime) {
      clearInterval(playerTimerInterval);
      const update = () => {
        const remaining = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
        const el = document.getElementById('player-timer-text');
        const box = document.getElementById('player-timer-box');
        if(!el) return clearInterval(playerTimerInterval);
        el.innerText = remaining;
        let color = remaining <= 5 ? 'text-red-600' : remaining <= 10 ? 'text-yellow-600' : 'text-green-600';
        box.className = `font-extrabold text-xl flex items-center gap-2 bg-gray-50 px-3 py-1 rounded-lg ${color}`;
        if (remaining <= 0) clearInterval(playerTimerInterval);
      };
      update(); playerTimerInterval = setInterval(update, 500);
    }

    // --- GRANULAR UPDATES (To prevent iframe reload) ---
    function updateGranular() {
      if (state.view === 'host') {
        const pList = Object.values(state.gameDoc.players || {});
        const pCountEl = document.getElementById('players-count');
        if (pCountEl) pCountEl.innerText = pList.length;
        
        const ansCountEl = document.getElementById('answered-count');
        if (ansCountEl) ansCountEl.innerText = pList.filter(p => p.currentAnswer !== -1).length;

        const lobbyListEl = document.getElementById('lobby-list');
        if (lobbyListEl) {
          lobbyListEl.innerHTML = pList.length === 0 ? `<p class="text-gray-400 italic w-full">Κανείς δεν έχει συνδεθεί ακόμα...</p>` : pList.map(p => `<span class="bg-white shadow-sm border border-gray-200 px-4 py-2 rounded-full text-lg font-medium text-gray-800 animate-pulse-fast">${escapeHtml(p.name)}</span>`).join('');
        }
      } else if (state.view === 'player') {
         const scoreEl = document.getElementById('player-score');
         if (scoreEl && state.gameDoc.players[state.user.uid]) {
            scoreEl.innerText = state.gameDoc.players[state.user.uid].score;
         }
      }
    }

    // Start App
    init();

  </script>
</body>
</html>
